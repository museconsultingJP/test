<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音感トレーニング</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#f2f2f7}
.app{width:100%;max-width:390px;margin:0 auto;background:#fff;min-height:100vh;display:flex;flex-direction:column;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}
.screen{display:none;flex:1;flex-direction:column;padding:16px}
.screen.active{display:flex}
h1{font-size:20px;font-weight:600;color:#1d1d1f;margin-bottom:20px;text-align:center}
h2{font-size:17px;font-weight:600;color:#1d1d1f;margin-bottom:12px}
select{width:100%;padding:10px 12px;font-size:15px;border:1px solid #d2d2d7;border-radius:10px;background:#fff;color:#1d1d1f;margin-bottom:16px;cursor:pointer;-webkit-appearance:none;appearance:none}
.btn{width:100%;background:#fff;border:1px solid #d2d2d7;border-radius:12px;padding:14px;font-size:15px;color:#1d1d1f;cursor:pointer;font-weight:500;text-align:center;-webkit-tap-highlight-color:transparent}
.btn:active{opacity:0.7}
.btn-primary{background:#534AB7;color:#fff;border-color:#534AB7}
.btn-primary:active{background:#3C3489}
.btn-home{font-size:13px;color:#6e6e73;border:none;background:none;cursor:pointer;padding:4px 0;margin-bottom:8px;align-self:flex-start;-webkit-tap-highlight-color:transparent}

/* メイン画面 */
.main-top{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px}
.topbar{display:flex;justify-content:space-between;align-items:center}
.timer{font-size:13px;color:#6e6e73;font-variant-numeric:tabular-nums}
.answer-area{background:#f5f5f7;border-radius:12px;padding:14px;text-align:center;font-size:16px;font-weight:600;color:#1d1d1f;min-height:52px;display:flex;align-items:center;justify-content:center;line-height:1.4}
.ok{color:#1a7f4b}.ng{color:#c0392b}

/* 下部操作ゾーン */
.bottom-zone{padding-top:12px;border-top:1px solid #e5e5ea;display:flex;flex-direction:column;gap:8px}
.keys-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.key-btn{padding:13px 2px;font-size:14px;font-weight:600;border-radius:10px;border:1px solid #d2d2d7;background:#fff;color:#1d1d1f;cursor:pointer;-webkit-tap-highlight-color:transparent}
.key-btn:active{background:#f0eeff;transform:scale(0.95)}
.key-btn.sharp{color:#534AB7}
.key-btn:disabled{opacity:0.35}

.play-row{display:grid;grid-template-columns:1fr 72px 1fr;align-items:center;gap:8px}
.pass-btn{padding:14px 0;font-size:13px;color:#6e6e73;border:1px dashed #d2d2d7;border-radius:10px;background:none;cursor:pointer;width:100%;-webkit-tap-highlight-color:transparent}
.pass-btn:active{background:#f5f5f7}
.pass-btn:disabled{opacity:0.35}
.play-col{display:flex;flex-direction:column;align-items:center;gap:4px}
.play-btn{width:64px;height:64px;border-radius:50%;background:#534AB7;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;box-shadow:0 3px 10px rgba(83,74,183,0.4)}
.play-btn:active{background:#3C3489;transform:scale(0.93)}
.play-btn:disabled{background:#aaa;box-shadow:none}
.play-icon{width:0;height:0;border-top:12px solid transparent;border-bottom:12px solid transparent;border-left:20px solid #fff;margin-left:4px}
.play-lbl{font-size:10px;color:#6e6e73;text-align:center}

/* 統計画面 */
.stat-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat-card{background:#f5f5f7;border-radius:10px;padding:12px;text-align:center}
.stat-lbl{font-size:11px;color:#6e6e73;margin-bottom:3px}
.stat-val{font-size:20px;font-weight:700;color:#1d1d1f}

/* 削除セクション */
.delete-section{border:1px solid #e5e5ea;border-radius:10px;overflow:hidden;margin-bottom:12px}
.delete-section-title{font-size:11px;font-weight:600;color:#6e6e73;padding:7px 12px;background:#f5f5f7;border-bottom:1px solid #e5e5ea}
.del-btn{width:100%;padding:12px 14px;font-size:13px;color:#1d1d1f;background:#fff;border:none;border-bottom:1px solid #f2f2f2;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px;-webkit-tap-highlight-color:transparent}
.del-btn:last-child{border-bottom:none}
.del-btn:active{background:#f5f5f7}
.del-btn.danger{color:#c0392b}
.del-icon{width:16px;text-align:center;flex-shrink:0;font-size:13px}

.legend{display:flex;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:#6e6e73}
.legend-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.oct-tabs{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap}
.oct-tab{padding:5px 10px;font-size:12px;border-radius:8px;border:1px solid #d2d2d7;background:#fff;color:#6e6e73;cursor:pointer;font-weight:500;-webkit-tap-highlight-color:transparent}
.oct-tab.active{background:#534AB7;color:#fff;border-color:#534AB7}
.note-table{width:100%;border-collapse:collapse;font-size:12px}
.note-table th{font-weight:600;color:#6e6e73;padding:5px 4px;border-bottom:1px solid #e5e5ea;text-align:left}
.note-table td{padding:5px 4px;border-bottom:1px solid #f2f2f2;color:#1d1d1f}
.badge{display:inline-block;font-size:9px;padding:1px 4px;border-radius:3px;margin-left:3px;vertical-align:middle;font-weight:600}
.badge-w20{background:#ffd5c8;color:#8b2500}
.badge-w40{background:#fde8a0;color:#6b4000}
.tr-w20 td{background:#fff5f2}
.tr-w40 td{background:#fffbee}

/* モーダル */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:16px 16px 0 0;padding:20px 20px 40px;width:100%;max-width:390px}
.modal-title{font-size:15px;font-weight:600;color:#1d1d1f;margin-bottom:6px}
.modal-body{font-size:13px;color:#6e6e73;margin-bottom:20px;line-height:1.5}
.modal-btns{display:flex;gap:8px}
.modal-cancel{flex:1;padding:13px;font-size:14px;border:1px solid #d2d2d7;border-radius:10px;background:#f5f5f7;color:#1d1d1f;cursor:pointer;font-weight:500}
.modal-confirm{flex:1;padding:13px;font-size:14px;border:none;border-radius:10px;background:#c0392b;color:#fff;cursor:pointer;font-weight:600}

.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.78);color:#fff;font-size:13px;padding:9px 18px;border-radius:20px;z-index:200;opacity:0;transition:opacity 0.2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.home-actions{display:flex;flex-direction:column;gap:10px;margin-top:auto}
</style>
</head>
<body>
<div class="app">

<!-- ホーム -->
<div id="screen-home" class="screen active">
  <h1>🎵 音感トレーニング</h1>
  <div style="margin-bottom:6px;font-size:13px;color:#6e6e73;font-weight:500">出題モード</div>
  <select id="mode-select">
    <option value="normal">通常（全対象から）</option>
    <option value="weak40">やや苦手（正答率下位40% または 所要時間上位40%）</option>
    <option value="weak20">苦手（正答率下位20% または 所要時間上位20%）</option>
  </select>
  <div class="home-actions">
    <button class="btn btn-primary" onclick="startTraining()">トレーニング開始</button>
    <button class="btn" onclick="showStats()">統計情報</button>
  </div>
</div>

<!-- メイン -->
<div id="screen-main" class="screen">
  <div class="main-top">
    <div class="topbar">
      <button class="btn-home" onclick="goHome()">← ホーム</button>
      <div class="timer">⏱ <span id="timer-display">0:00</span></div>
    </div>
    <div class="answer-area" id="answer-area">再生ボタンを押して音を鳴らしてください</div>
  </div>
  <div class="bottom-zone">
    <div class="keys-grid" id="keys-grid"></div>
    <div class="play-row">
      <button class="pass-btn" id="pass-btn" onclick="doPass()">パス</button>
      <div class="play-col">
        <button class="play-btn" id="play-btn" onclick="onPlayBtn()">
          <div class="play-icon"></div>
        </button>
        <div class="play-lbl" id="play-label">タップして再生</div>
      </div>
      <div></div>
    </div>
  </div>
</div>

<!-- 統計 -->
<div id="screen-stats" class="screen" style="overflow-y:auto">
  <button class="btn-home" onclick="goHome()">← ホーム</button>
  <h2>統計情報</h2>
  <div class="stat-cards">
    <div class="stat-card"><div class="stat-lbl">正解数</div><div class="stat-val" id="s-correct">0</div></div>
    <div class="stat-card"><div class="stat-lbl">試行数</div><div class="stat-val" id="s-total">0</div></div>
    <div class="stat-card"><div class="stat-lbl">正解率</div><div class="stat-val" id="s-rate">—</div></div>
    <div class="stat-card"><div class="stat-lbl">平均時間</div><div class="stat-val" id="s-avg">—</div></div>
  </div>
  <div class="delete-section">
    <div class="delete-section-title">記録の削除</div>
    <button class="del-btn" onclick="confirmDelete('overtime')"><span class="del-icon">⏱</span>60秒超の記録を削除</button>
    <button class="del-btn" onclick="confirmDelete('wrong')"><span class="del-icon">✗</span>誤答の記録を削除</button>
    <button class="del-btn danger" onclick="confirmDelete('all')"><span class="del-icon">🗑</span>すべての記録を削除</button>
  </div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#ffd5c8"></div>苦手（下位20%）</div>
    <div class="legend-item"><div class="legend-dot" style="background:#fde8a0"></div>やや苦手（下位40%）</div>
  </div>
  <div class="oct-tabs">
    <button class="oct-tab active" onclick="setOctTab('all',this)">全体</button>
    <button class="oct-tab" onclick="setOctTab(3,this)">oct3</button>
    <button class="oct-tab" onclick="setOctTab(4,this)">oct4</button>
    <button class="oct-tab" onclick="setOctTab(5,this)">oct5</button>
  </div>
  <div style="overflow-x:auto">
    <table class="note-table">
      <thead><tr><th>音名</th><th>正解</th><th>試行</th><th>正解率</th><th>平均時間</th></tr></thead>
      <tbody id="note-table-body"></tbody>
    </table>
  </div>
</div>

</div><!-- .app -->

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">キャンセル</button>
      <button class="modal-confirm" onclick="execDelete()">削除する</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function mk(n,o){return n+'_'+o;}

let stats=(function(){
  try{const s=JSON.parse(localStorage.getItem('oto_stats'));if(s)return s;}catch(e){}
  const s={};
  for(let o=3;o<=5;o++)NOTES.forEach(n=>{s[mk(n,o)]={correct:0,total:0,time:0};});
  return s;
})();
function saveStats(){try{localStorage.setItem('oto_stats',JSON.stringify(stats));}catch(e){}}

function noteFreq(note,oct){return 261.63*Math.pow(2,(NOTES.indexOf(note)+(oct-4)*12)/12);}
function makeWavBlob(freq){
  const sr=22050,n=Math.floor(sr*1.0),buf=new ArrayBuffer(44+n*2),view=new DataView(buf);
  function ws(o,s){for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i));}
  ws(0,'RIFF');view.setUint32(4,36+n*2,true);ws(8,'WAVE');ws(12,'fmt ');
  view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);
  view.setUint32(24,sr,true);view.setUint32(28,sr*2,true);
  view.setUint16(32,2,true);view.setUint16(34,16,true);ws(36,'data');view.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){
    const t=i/sr,ph=(t*freq)%1,tri=4*Math.abs(ph-0.5)-1,env=Math.min(1,t/0.008)*Math.exp(-3.8*t);
    const p2=(t*freq*2)%1,tri2=4*Math.abs(p2-0.5)-1,v=(tri*0.8+tri2*0.2)*env*0.38;
    view.setInt16(44+i*2,Math.max(-32768,Math.min(32767,Math.round(v*32767))),true);
  }
  return new Blob([buf],{type:'audio/wav'});
}
const blobCache={};
function getBlobUrl(note,oct){
  const k=mk(note,oct);
  if(!blobCache[k])blobCache[k]=URL.createObjectURL(makeWavBlob(noteFreq(note,oct)));
  return blobCache[k];
}
let audioEl=null;
function playSound(note,oct,cb){
  const url=getBlobUrl(note,oct);
  if(!audioEl)audioEl=new Audio();
  audioEl.pause();audioEl.currentTime=0;audioEl.src=url;audioEl.onended=null;
  const p=audioEl.play();if(p&&p.catch)p.catch(function(e){console.warn(e);});
  if(cb){
    var f=false;
    var d=function(){if(!f){f=true;cb();}};
    audioEl.onended=d;setTimeout(d,1150);
  }
}

let cur=null,t0=null,tiv=null,done=false,mode='normal',octTab='all',waitingFirst=true;

function show(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});document.getElementById(id).classList.add('active');}
function goHome(){stopTimer();show('screen-home');}
function showStats(){updateStats();show('screen-stats');}

function aggNote(n){
  var c=0,t=0,ti=0;
  for(var o=3;o<=5;o++){var k=mk(n,o);if(stats[k]){c+=stats[k].correct;t+=stats[k].total;ti+=stats[k].time;}}
  return{rate:t?c/t:null,avgTime:t?ti/t:null};
}
function classify(){
  var c20=Math.max(1,Math.ceil(NOTES.length*0.2)),c40=Math.max(1,Math.ceil(NOTES.length*0.4));
  var byR=[].concat(NOTES).sort(function(a,b){var ra=aggNote(a).rate,rb=aggNote(b).rate;return(ra!=null?ra:-1)-(rb!=null?rb:-1);});
  var withT=NOTES.filter(function(n){return aggNote(n).avgTime!==null;});
  var byT=[].concat(withT).sort(function(a,b){return aggNote(b).avgTime-aggNote(a).avgTime;});
  var r20=new Set(byR.slice(0,c20)),r40=new Set(byR.slice(0,c40));
  var t20=new Set(byT.slice(0,c20)),t40=new Set(byT.slice(0,c40));
  var res={};
  NOTES.forEach(function(n){var w20=r20.has(n)||t20.has(n),w40=r40.has(n)||t40.has(n);res[n]=w20?'w20':w40?'w40':'ok';});
  return res;
}
function getCands(m){
  if(m==='normal')return NOTES.slice();
  var cl=classify(),tgt=m==='weak20'?['w20']:['w20','w40'];
  var c=NOTES.filter(function(n){return tgt.indexOf(cl[n])>=0;});
  return c.length?c:NOTES.slice();
}
function pick(){var c=getCands(mode);return{note:c[Math.floor(Math.random()*c.length)],oct:3+Math.floor(Math.random()*3)};}

function startTraining(){
  mode=document.getElementById('mode-select').value;
  done=false;waitingFirst=true;buildKeys();setKeys(false);stopTimer();
  document.getElementById('timer-display').textContent='0:00';
  setArea('再生ボタンを押して音を鳴らしてください','answer-area');
  document.getElementById('play-btn').disabled=false;
  document.getElementById('play-label').textContent='タップして再生';
  show('screen-main');cur=pick();
}
function onPlayBtn(){
  if(!cur)return;
  document.getElementById('play-label').textContent='再生中...';
  document.getElementById('play-btn').disabled=true;
  playSound(cur.note,cur.oct,function(){
    document.getElementById('play-btn').disabled=false;
    document.getElementById('play-label').textContent='もう一度';
    if(!done){setArea('音名を選んでください','answer-area');if(waitingFirst){waitingFirst=false;startTimer();setKeys(true);}}
  });
}
function setArea(txt,cls){var a=document.getElementById('answer-area');a.textContent=txt;a.className=cls;}
function buildKeys(){
  var g=document.getElementById('keys-grid');g.innerHTML='';
  NOTES.forEach(function(n){
    var b=document.createElement('button');
    b.className='key-btn'+(n.indexOf('#')>=0?' sharp':'');
    b.textContent=n;b.dataset.note=n;
    b.onclick=function(){answer(n);};
    g.appendChild(b);
  });
}
function setKeys(en){
  document.querySelectorAll('.key-btn').forEach(function(b){b.disabled=!en;});
  document.getElementById('pass-btn').disabled=!en;
}
function startTimer(){
  t0=Date.now();
  tiv=setInterval(function(){
    var s=Math.floor((Date.now()-t0)/1000);
    document.getElementById('timer-display').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  },500);
}
function stopTimer(){clearInterval(tiv);tiv=null;}
function answer(ch){
  if(done)return;done=true;setKeys(false);document.getElementById('play-btn').disabled=true;
  var el=t0?(Date.now()-t0)/1000:0;stopTimer();
  var k=mk(cur.note,cur.oct);
  if(!stats[k])stats[k]={correct:0,total:0,time:0};
  stats[k].total++;stats[k].time+=el;
  var ok=ch===cur.note;if(ok)stats[k].correct++;
  saveStats();
  if(ch==='__pass__')setArea('— パス　正解は '+cur.note+' (oct '+cur.oct+')','answer-area ng');
  else if(ok)setArea('✓ 正解！　'+cur.note+' (oct '+cur.oct+')','answer-area ok');
  else setArea('✗ 不正解　正解は '+cur.note+' (oct '+cur.oct+')','answer-area ng');
  document.querySelectorAll('.key-btn').forEach(function(b){if(b.dataset.note===cur.note)b.style.background='#d4d0f5';});
  setTimeout(function(){
    done=false;
    document.querySelectorAll('.key-btn').forEach(function(b){b.style.background='';});
    cur=pick();waitingFirst=true;setKeys(false);t0=null;
    document.getElementById('timer-display').textContent='0:00';
    setArea('再生ボタンを押して音を鳴らしてください','answer-area');
    document.getElementById('play-btn').disabled=false;
    document.getElementById('play-label').textContent='タップして再生';
  },1500);
}
function doPass(){answer('__pass__');}

var pendingDeleteType=null;
var deleteConfig={
  all:{title:'すべての記録を削除',body:'全音名・全オクターブの記録をリセットします。この操作は取り消せません。'},
  overtime:{title:'60秒超の記録を削除',body:'所要時間の合計が60秒を超えた音の記録を削除します。'},
  wrong:{title:'誤答の記録を削除',body:'不正解・パス分の試行数をリセットします。正解数・所要時間はそのまま残ります。'},
};
function confirmDelete(type){
  pendingDeleteType=type;
  var cfg=deleteConfig[type];
  document.getElementById('modal-title').textContent=cfg.title;
  document.getElementById('modal-body').textContent=cfg.body;
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open');pendingDeleteType=null;}
function execDelete(){
  closeModal();
  if(!pendingDeleteType)return;
  var count=0;
  if(pendingDeleteType==='all'){
    Object.keys(stats).forEach(function(k){if(stats[k].total>0)count++;stats[k]={correct:0,total:0,time:0};});
  }else if(pendingDeleteType==='overtime'){
    Object.keys(stats).forEach(function(k){if(stats[k].time>60){count++;stats[k]={correct:0,total:0,time:0};}});
  }else if(pendingDeleteType==='wrong'){
    Object.keys(stats).forEach(function(k){var w=stats[k].total-stats[k].correct;if(w>0){count+=w;stats[k].total=stats[k].correct;}});
  }
  saveStats();updateStats();
  showToast(count>0?'削除しました':'削除対象の記録はありませんでした');
}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2200);}

function setOctTab(o,el){octTab=o;document.querySelectorAll('.oct-tab').forEach(function(t){t.classList.remove('active');});el.classList.add('active');renderTable();}
function updateStats(){
  var tc=0,tt=0,ti=0;
  Object.values(stats).forEach(function(s){tc+=s.correct;tt+=s.total;ti+=s.time;});
  document.getElementById('s-correct').textContent=tc;
  document.getElementById('s-total').textContent=tt;
  document.getElementById('s-rate').textContent=tt?Math.round(tc/tt*100)+'%':'—';
  document.getElementById('s-avg').textContent=tt?Math.round(ti/tt*10)/10+'s':'—';
  renderTable();
}
function renderTable(){
  var tb=document.getElementById('note-table-body');tb.innerHTML='';
  var cl=classify(),rows=[];
  if(octTab==='all'){
    NOTES.forEach(function(n){var c=0,t=0,ti=0;for(var o=3;o<=5;o++){var k=mk(n,o);if(stats[k]){c+=stats[k].correct;t+=stats[k].total;ti+=stats[k].time;}}rows.push({label:n,correct:c,total:t,time:ti,cls:cl[n]});});
  }else{
    NOTES.forEach(function(n){var k=mk(n,octTab),s=stats[k]||{correct:0,total:0,time:0};rows.push({label:n+octTab,correct:s.correct,total:s.total,time:s.time,cls:cl[n]});});
  }
  rows.forEach(function(r){
    var rate=r.total?Math.round(r.correct/r.total*100):null;
    var avg=r.total?Math.round(r.time/r.total*10)/10:null;
    var tr=document.createElement('tr');
    if(r.cls==='w20')tr.className='tr-w20';else if(r.cls==='w40')tr.className='tr-w40';
    var badge=r.cls==='w20'?'<span class="badge badge-w20">苦手</span>':r.cls==='w40'?'<span class="badge badge-w40">やや苦手</span>':'';
    tr.innerHTML='<td style="font-weight:600">'+r.label+badge+'</td><td>'+r.correct+'</td><td>'+r.total+'</td><td>'+(rate!==null?rate+'%':'—')+'</td><td>'+(avg!==null?avg+'s':'—')+'</td>';
    tb.appendChild(tr);
  });
}
</script>
</body>
</html>
